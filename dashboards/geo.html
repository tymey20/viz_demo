<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geographic Concentration — Apex Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg-primary:#f0f0f0; --bg-card:#ffffff; --border:#dcdcdc; --border-accent:#c0c0c0; --text-primary:#1a1a1a; --text-secondary:#555555; --text-muted:#767676; --accent-red:#CC0000; --accent-green:#2e7d32; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; }
  .brand-bar { background:#CC0000; height:4px; }
  .brand-header { background:#fff; border-bottom:1px solid var(--border); padding:14px 40px; display:flex; align-items:center; gap:14px; }
  .brand-key-icon { width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
  .brand-name { font-size:15px; font-weight:700; letter-spacing:-0.3px; }
  .brand-divider { width:1px; height:20px; background:#d4d4d4; }
  .brand-dept { font-size:12px; color:var(--text-muted); font-weight:500; }
  .nav-link { font-size:12px; color:var(--accent-red); text-decoration:none; font-weight:600; margin-left:auto; }
  .nav-link:hover { text-decoration:underline; }
  .dashboard { max-width:1440px; margin:0 auto; padding:32px 40px; }
  .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:32px; }
  .header-left h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
  .header-left .subtitle { font-size:13px; color:var(--text-muted); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .period-label { font-family:'JetBrains Mono',monospace; font-size:12px; color:#CC0000; background:rgba(204,0,0,0.06); padding:6px 14px; border-radius:6px; border:1px solid rgba(204,0,0,0.2); }
  .kpi-row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:28px; }
  .kpi-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; position:relative; overflow:hidden; }
  .kpi-card .kpi-bar { position:absolute; top:0; left:0; width:100%; height:3px; }
  .kpi-card .kpi-label { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
  .kpi-card .kpi-value { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; }
  .kpi-card .kpi-sub { font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:4px; color:var(--text-muted); }
  .chart-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:24px 28px; margin-bottom:20px; }
  .chart-title { font-size:14px; font-weight:600; margin-bottom:4px; }
  .chart-desc { font-size:12px; color:var(--text-muted); margin-bottom:16px; }
  .chart-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .chart-toggle { display:flex; gap:4px; background:var(--bg-primary); padding:3px; border-radius:6px; }
  .toggle-btn { font-family:'DM Sans',sans-serif; font-size:11px; padding:4px 12px; border:none; border-radius:4px; background:transparent; color:var(--text-muted); cursor:pointer; transition:all 0.2s; font-weight:500; }
  .toggle-btn.active { background:var(--bg-card); color:var(--text-primary); }
  .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .state-path { stroke:#fff; stroke-width:0.8; transition:all 0.2s; cursor:pointer; }
  .state-path:hover { stroke:#1a1a1a; stroke-width:1.5; filter:brightness(0.9); }
  .bar-chart-bar { transition:all 0.3s; cursor:pointer; }
  .bar-chart-bar:hover { opacity:0.8; }
  .detail-table { width:100%; border-collapse:separate; border-spacing:0; font-size:12px; }
  .detail-table thead th { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); font-weight:600; padding:8px 12px; text-align:right; border-bottom:1px solid var(--border); }
  .detail-table thead th:first-child { text-align:left; }
  .detail-table tbody td { font-family:'JetBrains Mono',monospace; font-size:12px; padding:10px 12px; text-align:right; border-bottom:1px solid rgba(220,220,220,0.5); color:var(--text-secondary); }
  .detail-table tbody td:first-child { font-family:'DM Sans',sans-serif; font-weight:600; color:var(--text-primary); text-align:left; }
  .detail-table tbody tr:hover td { background:rgba(204,0,0,0.03); }
  .tooltip { position:fixed; pointer-events:none; background:rgba(26,26,26,0.94); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px 14px; font-size:12px; color:#fff; z-index:1000; backdrop-filter:blur(8px); opacity:0; transition:opacity 0.15s; max-width:280px; }
  .tooltip.visible { opacity:1; }
  .tooltip .tt-label { font-size:10px; color:#b5b5b5; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .tooltip .tt-value { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; }
  .tooltip .tt-sub { font-size:11px; color:#d4d4d4; margin-top:2px; }
  .color-scale { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .color-scale-bar { height:10px; width:200px; border-radius:3px; }
  .color-scale-label { font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .animate-in { animation:fadeInUp 0.5s ease-out forwards; opacity:0; }
  .delay-1 { animation-delay:0.05s; } .delay-2 { animation-delay:0.1s; } .delay-3 { animation-delay:0.15s; }
  @media (max-width:1200px) { .kpi-row { grid-template-columns:repeat(3,1fr); } .summary-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="brand-bar"></div>
<div class="brand-header">
  <div class="brand-key-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="4" height="6" rx="1" fill="#CC0000"/><rect x="9" y="10" width="4" height="10" rx="1" fill="#CC0000" opacity="0.8"/><rect x="15" y="6" width="4" height="14" rx="1" fill="#CC0000" opacity="0.6"/></svg></div>
  <span class="brand-name">Apex Analytics</span>
  <div class="brand-divider"></div>
  <span class="brand-dept">Credit Risk Analytics &mdash; Geographic Concentration</span>
  <a href="/" class="nav-link">&larr; All Dashboards</a>
</div>
<div class="dashboard">
  <div class="header animate-in">
    <div class="header-left"><h1>Geographic Concentration</h1><div class="subtitle">State-level exposure distribution &mdash; Continental US</div></div>
    <div class="period-label" id="period-label"></div>
  </div>
  <div class="kpi-row animate-in delay-1" id="kpi-row"></div>
  <div class="chart-card animate-in delay-2">
    <div class="chart-header">
      <div><div class="chart-title">Exposure by State</div><div class="chart-desc">Hover over any state for detail</div></div>
      <div class="chart-toggle" id="view-toggle">
        <button class="toggle-btn active" data-view="exposure">Exposure</button>
        <button class="toggle-btn" data-view="risk">Risk Rating</button>
        <button class="toggle-btn" data-view="change">QoQ Change</button>
      </div>
    </div>
    <div id="map-chart"></div>
    <div class="color-scale" id="color-scale"></div>
  </div>
  <div class="summary-grid animate-in delay-3">
    <div class="chart-card">
      <div class="chart-title">Top 10 States by Exposure</div>
      <div id="bar-chart"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Regional Summary</div>
      <div class="chart-desc">Aggregated by census region</div>
      <div id="region-table"></div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
// Data is loaded from /api/geo at bootstrap (see end of file).
// The render code below is unchanged from the original; only the source of the
// dataset globals has changed.
let STATE_DATA;
// FIPS codes for states

let fipsLookup = {};
Object.entries(STATE_DATA).forEach(([fips, d]) => { fipsLookup[fips] = d; });

let viewMode = "exposure";
const ttEl = document.getElementById('tooltip');
function showTooltip(evt, html) { ttEl.innerHTML=html; ttEl.classList.add('visible'); ttEl.style.left=Math.min(evt.clientX+12,window.innerWidth-300)+'px'; ttEl.style.top=Math.min(evt.clientY-10,window.innerHeight-100)+'px'; }
function hideTooltip() { ttEl.classList.remove('visible'); }
const fmtM = d => '$'+Math.abs(d).toLocaleString()+'M';
const fmtPct = d => (d>=0?'+':'')+d.toFixed(1)+'%';

let totalExposure = 0;

function renderKPIs() {
  const states = Object.values(STATE_DATA);
  const topState = states.sort((a,b) => b.exposure-a.exposure)[0];
  const top5 = states.slice(0,5).reduce((s,d) => s+d.exposure, 0);
  const wtdRisk = states.reduce((s,d) => s+d.risk*d.exposure, 0) / totalExposure;
  const kpis = [
    {label:"Total Exposure",value:fmtM(totalExposure),sub:"across US",color:"#404040"},
    {label:"Active States",value:states.length,sub:"with exposure",color:"#1B6EC2"},
    {label:"Top State",value:topState.abbr,sub:fmtM(topState.exposure)+' ('+(topState.exposure/totalExposure*100).toFixed(1)+'%)',color:"#CC0000"},
    {label:"Top 5 Concentration",value:(top5/totalExposure*100).toFixed(1)+'%',sub:fmtM(top5),color:"#b8860b"},
    {label:"Wtd Avg Risk",value:wtdRisk.toFixed(2),sub:"portfolio weighted",color:"#2e7d32"},
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k =>
    `<div class="kpi-card"><div class="kpi-bar" style="background:${k.color}"></div><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div><div class="kpi-sub" style="color:${k.color}">${k.sub}</div></div>`
  ).join('');
}

function getColorScale() {
  const states = Object.values(STATE_DATA);
  if (viewMode === "exposure") {
    return d3.scaleSequential().domain([0, d3.max(states, d=>d.exposure)]).interpolator(t => d3.interpolateRgb('#f5f5f5','#CC0000')(Math.pow(t,0.6)));
  } else if (viewMode === "risk") {
    return d3.scaleSequential().domain([2.5, 4.5]).interpolator(t => d3.interpolateRgb('#2e7d32','#CC0000')(t));
  } else {
    return d3.scaleDiverging().domain([-2, 0, 4]).interpolator(d3.interpolateRdYlGn).clamp(true);
  }
}

function getStateValue(d) {
  if (viewMode === "exposure") return d.exposure;
  if (viewMode === "risk") return d.risk;
  return d.change;
}

function renderColorScale() {
  const el = document.getElementById('color-scale');
  const cs = getColorScale();
  let low, high;
  if (viewMode === "exposure") { low = "$0M"; high = fmtM(d3.max(Object.values(STATE_DATA), d=>d.exposure)); }
  else if (viewMode === "risk") { low = "2.5 (better)"; high = "4.5 (worse)"; }
  else { low = "-2% (decline)"; high = "+4% (growth)"; }
  const grad = viewMode === "change"
    ? "linear-gradient(to right, #d73027, #fee08b, #1a9850)"
    : `linear-gradient(to right, ${cs(cs.domain()[0])}, ${cs(cs.domain()[1])})`;
  el.innerHTML = `<span class="color-scale-label">${low}</span><div class="color-scale-bar" style="background:${grad}"></div><span class="color-scale-label">${high}</span>`;
}

async function renderMap() {
  const container = document.getElementById('map-chart');
  container.innerHTML = '';
  const width = container.clientWidth || 900, height = 520;

  const svg = d3.select(container).append('svg').attr('viewBox',`0 0 ${width} ${height}`).attr('width','100%');
  const colorScale = getColorScale();

  try {
    const us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
    const states = topojson.feature(us, us.objects.states);
    const projection = d3.geoAlbersUsa().fitSize([width - 40, height - 40], states).translate([width/2, height/2]);
    const path = d3.geoPath().projection(projection);

    svg.selectAll('.state-path')
      .data(states.features)
      .join('path')
      .attr('class', 'state-path')
      .attr('d', path)
      .attr('fill', d => {
        const fips = d.id;
        const sd = fipsLookup[fips];
        if (!sd) return '#e8e8e8';
        return colorScale(getStateValue(sd));
      })
      .on('mousemove', (evt, d) => {
        const sd = fipsLookup[d.id];
        if (!sd) return;
        const pct = (sd.exposure / totalExposure * 100).toFixed(1);
        showTooltip(evt, `<div class="tt-label">${sd.name}</div><div class="tt-value">${fmtM(sd.exposure)}</div><div class="tt-sub">${pct}% of portfolio · ${sd.obligors} obligors<br>Avg Risk: ${sd.risk.toFixed(1)} · QoQ: ${fmtPct(sd.change)}</div>`);
      })
      .on('mouseleave', hideTooltip);

    // State labels for top states
    const topStates = Object.entries(STATE_DATA).sort((a,b) => b[1].exposure - a[1].exposure).slice(0,10);
    svg.selectAll('.state-label')
      .data(topStates)
      .join('text')
      .attr('x', d => {
        const feat = states.features.find(f => f.id === d[0]);
        return feat ? path.centroid(feat)[0] : 0;
      })
      .attr('y', d => {
        const feat = states.features.find(f => f.id === d[0]);
        return feat ? path.centroid(feat)[1] : 0;
      })
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'middle')
      .attr('font-size', 9)
      .attr('font-weight', 700)
      .attr('font-family', "'JetBrains Mono', monospace")
      .attr('fill', d => {
        const sd = d[1];
        const val = getStateValue(sd);
        const c = colorScale(val);
        return d3.lab(c).l < 55 ? '#fff' : '#1a1a1a';
      })
      .attr('pointer-events', 'none')
      .text(d => d[1].abbr);
  } catch (err) {
    container.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-muted)">Map requires internet connection to load TopoJSON data</div>';
  }
}

function renderBarChart() {
  const container = document.getElementById('bar-chart');
  container.innerHTML = '';
  const states = Object.values(STATE_DATA).sort((a,b) => b.exposure - a.exposure).slice(0, 10);
  const width = container.clientWidth || 450, height = 340;
  const margin = {top:8,right:60,bottom:8,left:50}, innerW = width-margin.left-margin.right, innerH = height-margin.top-margin.bottom;

  const svg = d3.select(container).append('svg').attr('viewBox',`0 0 ${width} ${height}`).attr('width','100%');
  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);

  const y = d3.scaleBand().domain(states.map(d=>d.abbr)).range([0,innerH]).padding(0.3);
  const x = d3.scaleLinear().domain([0, d3.max(states, d=>d.exposure)*1.1]).range([0, innerW]);

  g.selectAll('.bar').data(states).join('rect')
    .attr('class','bar-chart-bar')
    .attr('x',0).attr('y',d=>y(d.abbr)).attr('height',y.bandwidth()).attr('rx',3)
    .attr('fill','#CC0000').attr('opacity',0.75)
    .attr('width',0)
    .on('mousemove',(evt,d) => showTooltip(evt,`<div class="tt-label">${d.name}</div><div class="tt-value">${fmtM(d.exposure)}</div><div class="tt-sub">${(d.exposure/totalExposure*100).toFixed(1)}% of portfolio</div>`))
    .on('mouseleave',hideTooltip)
    .transition().duration(600).delay((d,i)=>i*50).attr('width',d=>x(d.exposure));

  g.selectAll('.bar-label').data(states).join('text')
    .attr('x',-6).attr('y',d=>y(d.abbr)+y.bandwidth()/2)
    .attr('text-anchor','end').attr('dominant-baseline','middle')
    .attr('font-size',11).attr('font-weight',600).attr('fill','var(--text-primary)')
    .text(d=>d.abbr);

  g.selectAll('.bar-value').data(states).join('text')
    .attr('x',d=>x(d.exposure)+6).attr('y',d=>y(d.abbr)+y.bandwidth()/2)
    .attr('dominant-baseline','middle')
    .attr('font-size',10).attr('font-family',"'JetBrains Mono',monospace").attr('fill','var(--text-muted)')
    .attr('opacity',0)
    .text(d=>fmtM(d.exposure))
    .transition().duration(400).delay((d,i)=>i*50+400).attr('opacity',1);
}

function renderRegionTable() {
  const regions = {};
  Object.values(STATE_DATA).forEach(d => {
    if (!regions[d.region]) regions[d.region] = { exposure:0, states:0, riskSum:0, obligors:0 };
    regions[d.region].exposure += d.exposure;
    regions[d.region].states += 1;
    regions[d.region].riskSum += d.risk * d.exposure;
    regions[d.region].obligors += d.obligors;
  });
  const regionList = Object.entries(regions).map(([name, d]) => ({
    name, ...d, avgRisk: d.riskSum / d.exposure, pct: d.exposure / totalExposure * 100
  })).sort((a,b) => b.exposure - a.exposure);

  let html = '<table class="detail-table"><thead><tr><th>Region</th><th>Exposure ($M)</th><th>% Total</th><th>States</th><th>Obligors</th><th>Avg Risk</th></tr></thead><tbody>';
  regionList.forEach(r => {
    html += `<tr><td>${r.name}</td><td>${r.exposure.toLocaleString()}</td><td>${r.pct.toFixed(1)}%</td><td>${r.states}</td><td>${r.obligors}</td><td>${r.avgRisk.toFixed(2)}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('region-table').innerHTML = html;
}

document.querySelectorAll('#view-toggle .toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#view-toggle .toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.view;
    renderMap();
    renderColorScale();
  });
});

function renderAll() { renderKPIs(); renderMap(); renderColorScale(); renderBarChart(); renderRegionTable(); }
let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 200); });
async function bootstrap() {
  try {
    const payload = await fetch('/api/geo').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
    STATE_DATA = payload.states; Object.entries(STATE_DATA).forEach(([fips, d]) => { fipsLookup[fips] = d; }); totalExposure = Object.values(STATE_DATA).reduce((s,d) => s+d.exposure, 0);
    document.getElementById('period-label').textContent = payload.period_label;
    renderAll();
  } catch (err) {
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:#fee;border:1px solid #c00;border-radius:8px;padding:14px;margin:20px;color:#900;font-family:'JetBrains Mono',monospace;font-size:12px">Failed to load data: ${err.message}</div>`);
    console.error(err);
  }
}
bootstrap();
</script>
</body>
</html>
