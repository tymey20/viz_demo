<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Composition — Apex Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg-primary:#f0f0f0; --bg-card:#ffffff; --border:#dcdcdc; --border-accent:#c0c0c0; --text-primary:#1a1a1a; --text-secondary:#555555; --text-muted:#767676; --accent-red:#CC0000; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; }
  .brand-bar { background:#CC0000; height:4px; }
  .brand-header { background:#fff; border-bottom:1px solid var(--border); padding:14px 40px; display:flex; align-items:center; gap:14px; }
  .brand-key-icon { width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
  .brand-name { font-size:15px; font-weight:700; letter-spacing:-0.3px; }
  .brand-divider { width:1px; height:20px; background:#d4d4d4; }
  .brand-dept { font-size:12px; color:var(--text-muted); font-weight:500; }
  .nav-link { font-size:12px; color:var(--accent-red); text-decoration:none; font-weight:600; margin-left:auto; }
  .nav-link:hover { text-decoration:underline; }
  .dashboard { max-width:1440px; margin:0 auto; padding:32px 40px; }
  .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:32px; }
  .header-left h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
  .header-left .subtitle { font-size:13px; color:var(--text-muted); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .period-label { font-family:'JetBrains Mono',monospace; font-size:12px; color:#CC0000; background:rgba(204,0,0,0.06); padding:6px 14px; border-radius:6px; border:1px solid rgba(204,0,0,0.2); }
  .kpi-row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:28px; }
  .kpi-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; position:relative; overflow:hidden; }
  .kpi-card .kpi-bar { position:absolute; top:0; left:0; width:100%; height:3px; }
  .kpi-card .kpi-label { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
  .kpi-card .kpi-value { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; }
  .kpi-card .kpi-sub { font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:4px; color:var(--text-muted); }
  .chart-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:24px 28px; margin-bottom:20px; }
  .chart-title { font-size:14px; font-weight:600; margin-bottom:4px; }
  .chart-desc { font-size:12px; color:var(--text-muted); margin-bottom:16px; }
  .breadcrumb { display:flex; align-items:center; gap:6px; margin-bottom:16px; font-size:12px; }
  .breadcrumb-item { color:var(--accent-red); cursor:pointer; font-weight:600; }
  .breadcrumb-item:hover { text-decoration:underline; }
  .breadcrumb-item.current { color:var(--text-primary); cursor:default; }
  .breadcrumb-item.current:hover { text-decoration:none; }
  .breadcrumb-sep { color:var(--text-muted); }
  .treemap-container { position:relative; width:100%; height:560px; overflow:hidden; border-radius:8px; border:1px solid var(--border); }
  .treemap-cell { position:absolute; overflow:hidden; border:1px solid rgba(255,255,255,0.6); transition:all 0.4s cubic-bezier(0.16,1,0.3,1); cursor:pointer; }
  .treemap-cell:hover { filter:brightness(1.1); z-index:2; }
  .treemap-label { position:absolute; padding:6px 8px; font-size:11px; font-weight:600; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.5); pointer-events:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .treemap-label-sub { font-size:9px; font-weight:400; opacity:0.8; display:block; font-family:'JetBrains Mono',monospace; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); }
  .legend-dot { width:12px; height:12px; border-radius:3px; }
  .tooltip { position:fixed; pointer-events:none; background:rgba(26,26,26,0.94); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px 14px; font-size:12px; color:#fff; z-index:1000; backdrop-filter:blur(8px); opacity:0; transition:opacity 0.15s; max-width:280px; }
  .tooltip.visible { opacity:1; }
  .tooltip .tt-label { font-size:10px; color:#b5b5b5; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .tooltip .tt-value { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; }
  .tooltip .tt-sub { font-size:11px; color:#d4d4d4; margin-top:2px; }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .animate-in { animation:fadeInUp 0.5s ease-out forwards; opacity:0; }
  .delay-1 { animation-delay:0.05s; } .delay-2 { animation-delay:0.1s; } .delay-3 { animation-delay:0.15s; }
  @media (max-width:1200px) { .kpi-row { grid-template-columns:repeat(3,1fr); } .treemap-container { height:400px; } }
</style>
</head>
<body>
<div class="brand-bar"></div>
<div class="brand-header">
  <div class="brand-key-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="4" height="6" rx="1" fill="#CC0000"/><rect x="9" y="10" width="4" height="10" rx="1" fill="#CC0000" opacity="0.8"/><rect x="15" y="6" width="4" height="14" rx="1" fill="#CC0000" opacity="0.6"/></svg></div>
  <span class="brand-name">Apex Analytics</span>
  <div class="brand-divider"></div>
  <span class="brand-dept">Credit Risk Analytics &mdash; Portfolio Composition</span>
  <a href="index.html" class="nav-link">&larr; All Dashboards</a>
</div>
<div class="dashboard">
  <div class="header animate-in">
    <div class="header-left"><h1>Portfolio Composition</h1><div class="subtitle">Hierarchical exposure breakdown &mdash; LOB &rarr; Industry &rarr; Obligor</div></div>
    <div class="period-label">Q1 2026</div>
  </div>
  <div class="kpi-row animate-in delay-1" id="kpi-row"></div>
  <div class="chart-card animate-in delay-2">
    <div class="chart-title">Exposure Treemap</div>
    <div class="chart-desc">Click to zoom into any segment &middot; Color = risk rating &middot; Size = exposure</div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="treemap-container" id="treemap"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2e7d32"></div>Pass</div>
      <div class="legend-item"><div class="legend-dot" style="background:#b8860b"></div>Watch</div>
      <div class="legend-item"><div class="legend-dot" style="background:#CC0000"></div>Substandard</div>
      <div class="legend-item"><div class="legend-dot" style="background:#990000"></div>Doubtful</div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const RISK_COLORS = { Pass:"#2e7d32", Watch:"#b8860b", Substandard:"#CC0000", Doubtful:"#990000" };
const LOB_RISK = { "C&I":"Pass", "CRE":"Watch", "SBL":"Pass", "Multifamily":"Pass" };

const PORTFOLIO = {
  name:"Portfolio", children:[
    { name:"C&I", risk:"Pass", children:[
      { name:"Healthcare", risk:"Pass", children:[
        {name:"Mercy Health Partners",value:145,risk:"Pass"},{name:"Pinnacle Medical Group",value:112,risk:"Pass"},
        {name:"CareFirst Regional Hospital",value:98,risk:"Watch"},{name:"NovaCare Rehabilitation",value:88,risk:"Pass"},
        {name:"Tri-County Health Systems",value:82,risk:"Pass"},{name:"Summit Behavioral Health",value:75,risk:"Pass"},
        {name:"Heartland Senior Living",value:65,risk:"Watch"},{name:"Pacific Dental Partners",value:52,risk:"Pass"},
        {name:"Apex Urgent Care Holdings",value:42,risk:"Substandard"},{name:"Lakeview Specialty Clinic",value:38,risk:"Pass"},
      ]},
      { name:"Technology", risk:"Pass", children:[
        {name:"Nexus Cloud Solutions",value:120,risk:"Pass"},{name:"Veristream Data Corp",value:105,risk:"Pass"},
        {name:"Quantum Edge AI",value:95,risk:"Pass"},{name:"CyberVault Security",value:88,risk:"Pass"},
        {name:"DataPulse Analytics",value:78,risk:"Pass"},{name:"TechBridge Platforms",value:65,risk:"Pass"},
        {name:"CloudForge Inc",value:55,risk:"Pass"},{name:"Sentinel IoT Systems",value:48,risk:"Pass"},
      ]},
      { name:"Manufacturing", risk:"Watch", children:[
        {name:"Ironworks Precision Mfg",value:95,risk:"Watch"},{name:"Cascade Metals Group",value:88,risk:"Pass"},
        {name:"Heartland Plastics Inc",value:72,risk:"Substandard"},{name:"Summit Tooling Corp",value:65,risk:"Pass"},
        {name:"Great Lakes Fabrication",value:55,risk:"Watch"},{name:"Atlas Components LLC",value:48,risk:"Pass"},
        {name:"Pioneer Industrial",value:42,risk:"Pass"},{name:"Midwest Stamping Co",value:38,risk:"Pass"},
      ]},
      { name:"Retail Trade", risk:"Watch", children:[
        {name:"Grandview Retail Partners",value:78,risk:"Watch"},{name:"Sterling Home Furnishings",value:65,risk:"Substandard"},
        {name:"BrightMart Holdings",value:52,risk:"Pass"},{name:"Northern Outlet Group",value:48,risk:"Watch"},
        {name:"Riverdale Auto Parts",value:42,risk:"Pass"},{name:"Peak Sporting Goods",value:35,risk:"Pass"},
        {name:"Harbor General Store",value:30,risk:"Pass"},{name:"Main Street Brands",value:28,risk:"Pass"},
      ]},
    ]},
    { name:"CRE", risk:"Watch", children:[
      { name:"Office", risk:"Substandard", children:[
        {name:"Metro Tower Partners",value:155,risk:"Substandard"},{name:"Civic Center Properties",value:128,risk:"Watch"},
        {name:"Lakefront Office REIT",value:110,risk:"Watch"},{name:"Cornerstone Business Park",value:95,risk:"Pass"},
        {name:"Gateway Tower Holdings",value:82,risk:"Substandard"},{name:"Meridian Plaza LLC",value:68,risk:"Pass"},
        {name:"Harbor View Office",value:55,risk:"Pass"},{name:"Summit Ridge Campus",value:45,risk:"Pass"},
      ]},
      { name:"Industrial", risk:"Pass", children:[
        {name:"Great Lakes Logistics Park",value:110,risk:"Pass"},{name:"Midwest Distribution Hub",value:95,risk:"Pass"},
        {name:"Central Corridor Warehousing",value:82,risk:"Pass"},{name:"Buckeye Flex Space",value:68,risk:"Pass"},
        {name:"Pinnacle Cold Storage",value:62,risk:"Pass"},{name:"Northern Industrial REIT",value:55,risk:"Pass"},
        {name:"CrossDock Partners",value:48,risk:"Pass"},
      ]},
      { name:"Retail CRE", risk:"Watch", children:[
        {name:"Towne Centre Mall LP",value:72,risk:"Substandard"},{name:"Heritage Shopping Plaza",value:58,risk:"Watch"},
        {name:"Crossroads Retail REIT",value:52,risk:"Pass"},{name:"Maple Grove Strip Center",value:45,risk:"Pass"},
        {name:"Lakeshore Marketplace",value:38,risk:"Pass"},{name:"Eastgate Commons",value:35,risk:"Watch"},
      ]},
      { name:"Hospitality", risk:"Pass", children:[
        {name:"Lakeshore Resort Group",value:65,risk:"Pass"},{name:"Heritage Inn Collection",value:55,risk:"Watch"},
        {name:"Metro Select Hotels",value:48,risk:"Pass"},{name:"Cascade Lodge Partners",value:42,risk:"Pass"},
        {name:"Riverfront Hospitality",value:38,risk:"Pass"},{name:"Bayview Conference Center",value:25,risk:"Pass"},
      ]},
    ]},
    { name:"SBL", risk:"Pass", children:[
      { name:"Prof Services", risk:"Pass", children:[
        {name:"Meridian Law Partners",value:48,risk:"Pass"},{name:"Cornerstone CPA Group",value:42,risk:"Pass"},
        {name:"Summit Advisory LLC",value:35,risk:"Pass"},{name:"Lakeview Engineering",value:28,risk:"Pass"},
        {name:"Brightpath Consulting",value:22,risk:"Pass"},{name:"Apex Marketing Group",value:15,risk:"Watch"},
      ]},
      { name:"Restaurants", risk:"Watch", children:[
        {name:"Great Lakes Restaurant Grp",value:32,risk:"Substandard"},{name:"Metro Dining Holdings",value:25,risk:"Watch"},
        {name:"Fireside Grill Concepts",value:20,risk:"Pass"},{name:"Harbor Fresh Inc",value:18,risk:"Pass"},
        {name:"Cornerstone Catering",value:15,risk:"Watch"},{name:"Sunrise Bakery Chain",value:10,risk:"Pass"},
      ]},
    ]},
    { name:"Multifamily", risk:"Pass", children:[
      { name:"Multifamily A", risk:"Pass", children:[
        {name:"Parkview Apartments REIT",value:135,risk:"Pass"},{name:"Metro Living Partners",value:115,risk:"Pass"},
        {name:"Lakewood Residential",value:98,risk:"Pass"},{name:"Summit View Apartments",value:85,risk:"Pass"},
        {name:"Heritage Garden Homes",value:72,risk:"Pass"},{name:"Crossroads Multi-Family",value:62,risk:"Pass"},
        {name:"Riverside Community LP",value:48,risk:"Pass"},{name:"Northgate Residential",value:35,risk:"Pass"},
      ]},
      { name:"Multifamily B", risk:"Pass", children:[
        {name:"Eastside Housing Group",value:85,risk:"Pass"},{name:"Willowbrook Apartments",value:72,risk:"Pass"},
        {name:"Gateway Residences",value:58,risk:"Watch"},{name:"Central Park Estates",value:52,risk:"Pass"},
        {name:"Cedar Grove Living",value:45,risk:"Pass"},{name:"Hilltop Apartment Group",value:38,risk:"Pass"},
        {name:"Oakmont Housing LP",value:30,risk:"Pass"},
      ]},
    ]},
  ]
};

const ttEl = document.getElementById('tooltip');
function showTooltip(evt, html) { ttEl.innerHTML=html; ttEl.classList.add('visible'); ttEl.style.left=Math.min(evt.clientX+12,window.innerWidth-300)+'px'; ttEl.style.top=Math.min(evt.clientY-10,window.innerHeight-100)+'px'; }
function hideTooltip() { ttEl.classList.remove('visible'); }
const fmtM = d => '$'+Math.abs(d).toLocaleString()+'M';

function sumValues(node) { return node.value || (node.children ? node.children.reduce((s,c) => s+sumValues(c), 0) : 0); }
function countLeaves(node) { return node.value ? 1 : (node.children ? node.children.reduce((s,c) => s+countLeaves(c), 0) : 0); }
function getAvgRisk(node) {
  if (node.value) return node.risk;
  if (!node.children) return "Pass";
  const risks = { Pass:0, Watch:0, Substandard:0, Doubtful:0 };
  function walk(n) { if (n.value) { risks[n.risk] = (risks[n.risk]||0) + n.value; } else if (n.children) n.children.forEach(walk); }
  walk(node);
  const maxRisk = Object.entries(risks).sort((a,b) => b[1]-a[1])[0];
  return maxRisk[0];
}

const totalPortfolio = sumValues(PORTFOLIO);

function renderKPIs() {
  const totalObs = countLeaves(PORTFOLIO);
  const industries = PORTFOLIO.children.reduce((s,lob) => s + (lob.children ? lob.children.length : 0), 0);
  const largest = [];
  PORTFOLIO.children.forEach(lob => { if(lob.children) lob.children.forEach(ind => { largest.push({ name:ind.name, val:sumValues(ind) }); }); });
  largest.sort((a,b) => b.val-a.val);
  const topConc = (largest[0].val / totalPortfolio * 100).toFixed(1);
  const hhi = largest.reduce((s,l) => s + Math.pow(l.val/totalPortfolio*100, 2), 0).toFixed(0);
  const kpis = [
    { label:"Total Exposure", value:fmtM(totalPortfolio), sub:"across all LOBs", color:"#404040" },
    { label:"Industries", value:industries, sub:"segments", color:"#2e7d32" },
    { label:"Obligors", value:totalObs, sub:"individual names", color:"#1B6EC2" },
    { label:"Top Concentration", value:topConc+'%', sub:largest[0].name, color:"#CC0000" },
    { label:"HHI Index", value:hhi, sub:hhi<1500?"diversified":"concentrated", color:"#b8860b" },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k =>
    `<div class="kpi-card"><div class="kpi-bar" style="background:${k.color}"></div><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div><div class="kpi-sub" style="color:${k.color}">${k.sub}</div></div>`
  ).join('');
}

let currentNode = PORTFOLIO;
let breadcrumbPath = [PORTFOLIO];

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = breadcrumbPath.map((node, i) => {
    const isLast = i === breadcrumbPath.length - 1;
    const sep = i > 0 ? '<span class="breadcrumb-sep">›</span>' : '';
    return sep + `<span class="breadcrumb-item ${isLast?'current':''}" data-idx="${i}">${node.name}</span>`;
  }).join('');
  el.querySelectorAll('.breadcrumb-item:not(.current)').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      breadcrumbPath = breadcrumbPath.slice(0, idx + 1);
      currentNode = breadcrumbPath[breadcrumbPath.length - 1];
      renderTreemap();
      renderBreadcrumb();
    });
  });
}

function getNodeColor(node) {
  if (node.risk) return RISK_COLORS[node.risk] || '#767676';
  const r = getAvgRisk(node);
  return RISK_COLORS[r] || '#767676';
}

function renderTreemap() {
  const container = document.getElementById('treemap');
  container.innerHTML = '';
  const w = container.clientWidth, h = container.clientHeight;

  const root = d3.hierarchy(currentNode).sum(d => d.value || 0).sort((a, b) => b.value - a.value);
  d3.treemap().size([w, h]).padding(2).round(true)(root);

  const nodes = root.children || [];
  nodes.forEach((node, i) => {
    const cell = document.createElement('div');
    cell.className = 'treemap-cell';
    const color = getNodeColor(node.data);
    cell.style.cssText = `left:${node.x0}px;top:${node.y0}px;width:${node.x1-node.x0}px;height:${node.y1-node.y0}px;background:${color};opacity:0;`;

    const cellW = node.x1 - node.x0, cellH = node.y1 - node.y0;
    if (cellW > 50 && cellH > 30) {
      const label = document.createElement('div');
      label.className = 'treemap-label';
      label.style.width = (cellW - 12) + 'px';
      const pct = (node.value / totalPortfolio * 100).toFixed(1);
      label.innerHTML = node.data.name + `<span class="treemap-label-sub">${fmtM(node.value)} · ${pct}%</span>`;
      cell.appendChild(label);
    }

    cell.addEventListener('mousemove', evt => {
      const pct = (node.value / totalPortfolio * 100).toFixed(1);
      const risk = node.data.risk || getAvgRisk(node.data);
      showTooltip(evt, `<div class="tt-label">${node.data.name}</div><div class="tt-value">${fmtM(node.value)}</div><div class="tt-sub">${pct}% of portfolio · Risk: ${risk}</div>`);
    });
    cell.addEventListener('mouseleave', hideTooltip);

    if (node.data.children && node.data.children.length > 0) {
      cell.addEventListener('click', () => {
        hideTooltip();
        currentNode = node.data;
        breadcrumbPath.push(currentNode);
        renderTreemap();
        renderBreadcrumb();
      });
    }

    container.appendChild(cell);
    setTimeout(() => { cell.style.opacity = '1'; }, i * 30);
  });
}

function renderAll() { renderKPIs(); renderBreadcrumb(); renderTreemap(); }
let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 200); });
renderAll();
</script>
</body>
</html>
