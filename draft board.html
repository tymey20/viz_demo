<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Board</title>
<style>
  :root{
    --ink:#141B24;
    --panel:#1C2632;
    --panel-2:#222E3C;
    --line:#2E3D4E;
    --text:#E9EEF3;
    --dim:#8B9CAE;
    --dimmer:#5B6B7C;
    --qb:#E8A33D;
    --rb:#54C48D;
    --wr:#5BA8E8;
    --te:#C784DA;
    --mine:#F0C674;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.35;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    padding:14px;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--wr);outline-offset:2px;border-radius:3px}

  .wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 28px)}

  /* ---- top bar ---- */
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
  .seg button{padding:8px 16px;color:var(--dim);font-weight:600;font-size:13px;letter-spacing:.01em}
  .seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}
  .seg button+button{border-left:1px solid var(--line)}

  .searchwrap{position:relative;flex:1 1 300px;min-width:220px}
  #search{
    width:100%;padding:10px 13px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:7px;font-size:16px;
  }
  #search::placeholder{color:var(--dimmer)}
  #results{
    position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:30;
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);overflow:hidden;display:none;
  }
  #results.on{display:block}
  #results .r{display:flex;align-items:center;gap:9px;padding:9px 12px;width:100%;text-align:left}
  #results .r.sel{background:rgba(91,168,232,.16)}
  #results .r .rk{color:var(--dim);font-size:12px;width:30px;flex:none}
  .hint{color:var(--dimmer);font-size:12px;padding:7px 12px;border-top:1px solid var(--line)}

  .tally{display:flex;gap:16px;font-size:13px;color:var(--dim);margin-left:auto;flex:none}
  .tally b{color:var(--text);font-weight:600}
  .reset{font-size:12px;color:var(--dimmer);text-decoration:underline;text-underline-offset:3px}
  .reset:hover{color:var(--text)}

  /* ---- main grid ---- */
  .grid{display:grid;grid-template-columns:280px 1fr;gap:12px;align-items:start;flex:1}
  @media(max-width:840px){.grid{grid-template-columns:1fr}}

  /* ---- best available ---- */
  .top{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .top .head{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600}
  .hero{padding:16px 14px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .hero:hover{background:var(--panel-2)}
  .hero .n{font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.08}
  .hero .m{margin-top:7px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
  .pill{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;color:#101820}
  .rest .row .rk{width:32px}

  /* ---- rows ---- */
  .row{display:flex;align-items:center;gap:9px;padding:6px 12px;width:100%;text-align:left;border-top:1px solid transparent}
  .row:hover{background:var(--panel-2)}
  .row .rk{color:var(--dimmer);font-size:12px;width:28px;flex:none}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .row .po{font-size:11px;font-weight:700;flex:none;width:34px;text-align:right}
  .row .claim{
    flex:none;width:20px;height:20px;border:1px solid var(--line);border-radius:5px;
    color:var(--dimmer);font-size:13px;line-height:18px;text-align:center;opacity:0;
  }
  .row:hover .claim,.row .claim:focus-visible{opacity:1}
  .row .claim:hover{border-color:var(--mine);color:var(--mine)}
  .row.absent .nm{color:var(--dimmer);font-style:italic}

  /* ---- position columns ---- */
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:1080px){.cols{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.cols{grid-template-columns:1fr}}
  .col{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
  .col .head{padding:8px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
  .col .head .p{font-weight:700;font-size:14px}
  .col .head .c{color:var(--dimmer);font-size:12px;margin-left:auto}
  .col .body{max-height:46vh;overflow-y:auto}
  .empty{padding:14px 12px;color:var(--dimmer);font-size:13px}

  /* ---- log / roster ---- */
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:840px){.foot{grid-template-columns:1fr}}
  .box{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
  .box .head{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600;display:flex}
  .box .head .c{margin-left:auto;color:var(--dimmer)}
  .box .body{max-height:170px;overflow-y:auto}
  .log .row .nm{color:var(--dim)}
  .log .row.is-mine .nm{color:var(--mine)}
  .log .row .x{color:var(--dimmer);font-size:12px;flex:none;opacity:0}
  .log .row:hover .x{opacity:1}

  .note{color:var(--dimmer);font-size:12px;line-height:1.5;padding:2px 2px 6px}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:#33445A;border-radius:5px}
  @media(prefers-reduced-motion:no-preference){.hero,.row{transition:background .09s}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="seg" role="group" aria-label="Scoring format">
      <button id="fStd" aria-pressed="true">Standard</button>
      <button id="fPpr" aria-pressed="false">PPR</button>
    </div>

    <div class="searchwrap">
      <input id="search" autocomplete="off" spellcheck="false"
             placeholder="Type a name, Enter to mark drafted">
      <div id="results" role="listbox"></div>
    </div>

    <div class="tally">
      <span><b id="cGone">0</b> off the board</span>
      <span><b id="cMine">0</b> on my roster</span>
      <button class="reset" id="reset">Clear board</button>
    </div>
  </div>

  <div class="grid">
    <div class="top">
      <div class="head">Best available</div>
      <div id="hero"></div>
      <div class="rest" id="rest"></div>
    </div>
    <div class="cols" id="cols"></div>
  </div>

  <div class="foot">
    <div class="box log">
      <div class="head">Draft log<span class="c" id="logCount"></span></div>
      <div class="body" id="log"><div class="empty">Nobody's off the board yet.</div></div>
    </div>
    <div class="box">
      <div class="head">My roster<span class="c" id="rosCount"></span></div>
      <div class="body" id="roster"><div class="empty">Claim a player with the square on his row, or Shift+Enter from search.</div></div>
    </div>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
const PLAYERS = [{"name":"Jahmyr Gibbs","pos":"RB","std":1,"ppr":1},{"name":"Bijan Robinson","pos":"RB","std":2,"ppr":2},{"name":"Jonathan Taylor","pos":"RB","std":3,"ppr":7},{"name":"Christian McCaffrey","pos":"RB","std":4,"ppr":3},{"name":"James Cook","pos":"RB","std":5,"ppr":8},{"name":"Ja'Marr Chase","pos":"WR","std":6,"ppr":4},{"name":"Jaxon Smith-Njigba","pos":"WR","std":7,"ppr":5},{"name":"Puka Nacua","pos":"WR","std":8,"ppr":6},{"name":"Saquon Barkley","pos":"RB","std":9,"ppr":9},{"name":"Derrick Henry","pos":"RB","std":10,"ppr":20},{"name":"Amon-Ra St. Brown","pos":"WR","std":11,"ppr":10},{"name":"De'Von Achane","pos":"RB","std":12,"ppr":15},{"name":"Kyren Williams","pos":"RB","std":13,"ppr":19},{"name":"Nico Collins","pos":"WR","std":14,"ppr":14},{"name":"CeeDee Lamb","pos":"WR","std":15,"ppr":11},{"name":"Justin Jefferson","pos":"WR","std":16,"ppr":12},{"name":"Drake London","pos":"WR","std":17,"ppr":13},{"name":"Chase Brown","pos":"RB","std":18,"ppr":16},{"name":"Kenneth Walker","pos":"RB","std":19,"ppr":24},{"name":"Ashton Jeanty","pos":"RB","std":20,"ppr":21},{"name":"A.J. Brown","pos":"WR","std":21,"ppr":17},{"name":"DeVonta Smith","pos":"WR","std":22,"ppr":18},{"name":"Chris Olave","pos":"WR","std":23,"ppr":22},{"name":"Zay Flowers","pos":"WR","std":24,"ppr":23},{"name":"George Pickens","pos":"WR","std":25,"ppr":25},{"name":"Josh Allen","pos":"QB","std":26,"ppr":33},{"name":"Javonte Williams","pos":"RB","std":27,"ppr":30},{"name":"Tee Higgins","pos":"WR","std":28,"ppr":26},{"name":"Tetairoa McMillan","pos":"WR","std":29,"ppr":27},{"name":"Quinshon Judkins","pos":"RB","std":30,"ppr":34},{"name":"Breece Hall","pos":"RB","std":31,"ppr":31},{"name":"Omarion Hampton","pos":"RB","std":32,"ppr":32},{"name":"Travis Etienne","pos":"RB","std":33,"ppr":36},{"name":"Trey McBride","pos":"TE","std":34,"ppr":28},{"name":"Brock Bowers","pos":"TE","std":35,"ppr":29},{"name":"Lamar Jackson","pos":"QB","std":36,"ppr":45},{"name":"Malik Nabers","pos":"WR","std":37,"ppr" ppr":61},{"name":"Harold Fannin","pos":"TE","std":75,"ppr":62},{"name":"Colston Loveland","pos":"TE","std":76,"ppr":63},{"name":"Justin Herbert","pos":"QB","std":77,"ppr":82},{"name":"Jayden Daniels","pos":"QB","std":78,"ppr":83},{"name":"Jalen Hurts","pos":"QB","std":79,"ppr":84},{"name":"DK Metcalf","pos":"WR","std":80,"ppr":77},{"name":"Chris Godwin","pos":"WR","std":81,"ppr":73},{"name":"Michael Pittman","pos":"WR","std":82,"ppr":74},{"name":"Michael Wilson","pos":"WR","std":83,"ppr":79},{"name":"Marvin Harrison","pos":"WR","std":84,"ppr":81},{"name":"Jakobi Meyers","pos":"WR","std":85,"ppr":80},{"name":"Chuba Hubbard","pos":"RB","std":86,"ppr":88},{"name":"Jonathon Brooks","pos":"RB","std":87,"ppr":89},{"name":"Blake Corum","pos":"RB","std":88,"ppr":85},{"name":"Chris Rodriguez","pos":"RB","std":89,"ppr":102},{"name":"Rico Dowdle","pos":"RB","std":90,"ppr":91},{"name":"Aaron Jones","pos":"RB","std":91,"ppr":92},{"name":"Dak Prescott","pos":"QB","std":92,"ppr":107},{"name":"Caleb Williams","pos":"QB","std":93,"ppr":108},{"name":"Trevor Lawrence","pos":"QB","std":94,"ppr":109},{"name":"Rachaad White","pos":"RB","std":95,"ppr":90},{"name":"Jacory Croskey-Merritt","pos":"RB","std":96,"ppr":113},{"name":"Quentin Johnston","pos":"WR","std":97,"ppr":106},{"name":"Jordan Addison","pos":"WR","std":98,"ppr":104},{"name":"Stefon Diggs","pos":"WR","std":99,"ppr":94},{"name":"De'Zhaun Stribling","pos":"WR","std":100,"ppr":110},{"name":"Makai Lemon","pos":"WR","std":101,"ppr":111},{"name":"Wan'Dale Robinson","pos":"WR","std":102,"ppr":93},{"name":"Kenneth Gainwell","pos":"RB","std":103,"ppr":86},{"name":"Jordan Mason","pos":"RB","std":104,"ppr":112},{"name":"Woody Marks","pos":"RB","std":105,"ppr":101},{"name":"Tyler Allgeier","pos":"RB","std":106,"ppr":116},{"name":"Tucker Kraft","pos":"TE","std":107,"ppr":95},{"name":"George Kittle","pos":"TE","std":108,"ppr":96},{"name":"Brenton Strange","pos":"TE","std":109,"ppr":97},{"name":"Juwan Johnson","pos":"TE","std":110,"ppr":98},{"name":"Kyle Pitts","pos":"TE","std":111,"ppr":99},{"name":"Travis Kelce","pos":"TE","std":112,"ppr":100},{"name":"Jared Goff","pos":"QB","std":113,"ppr":128},{"name":"Patrick Mahomes","pos":"QB","std":114,"ppr":129},{"name":"Brock Purdy","pos":"QB","std":115,"ppr":130},{"name":"Keaton Mitchell","pos":"RB","std":116,"ppr":126},{"name":"Kyle Monangai","pos":"RB","std":117,"ppr":133},{"name":"Khalil Shakir","pos":"WR","std":118,"ppr":103},{"name":"Jayden Reed","pos":"WR","std":119,"ppr":105},{"name":"Josh Downs","pos":"WR","std":120,"ppr":114},{"name":"Romeo Doubs","pos":"WR","std":121,"ppr":115},{"name":"Brian Robinson","pos":"RB","std":122,"ppr":143},{"name":"Chris Brooks","pos":"RB","std":123,"ppr":144},{"name":"Kaleb Johnson","pos":"RB","std":124,"ppr":145},{"name":"Braelon Allen","pos":"RB","std":125,"ppr":146},{"name":"Kimani Vidal","pos":"RB","std":126,"ppr":127},{"name":"Kaelon Black","pos":"RB","std":127,"ppr":147},{"name":"Isaiah Likely","pos":"TE","std":128,"ppr":117},{"name":"Mark Andrews","pos":"TE","std":129,"ppr":118},{"name":"Bo Nix","pos":"QB","std":130,"ppr":148},{"name":"Jaxson Dart","pos":"QB","std":131,"ppr":149},{"name":"Jordan Love","pos":"QB","std":132,"ppr":150},{"name":"Jalen Coker","pos":"WR","std":133,"ppr":119},{"name":"Matthew Golden","pos":"WR","std":134,"ppr":120},{"name":"Deebo Samuel","pos":"WR","std":135,"ppr":125},{"name":"KC Concepcion","pos":"WR","std":136,"ppr":121},{"name":"Denzel Boston","pos":"WR","std":137,"ppr":122},{"name":"Rashid Shaheed","pos":"WR","std":138,"ppr":135},{"name":"Malachi Fields","pos":"WR","std":139,"ppr":136},{"name":"Jordyn Tyson","pos":"WR","std":140,"ppr":137},{"name":"Keenan Allen","pos":"WR","std":141,"ppr":123},{"name":"Jauan Jennings","pos":"WR","std":142,"ppr":124},{"name":"Isaac TeSlaa","pos":"WR","std":143,"ppr":140},{"name":"Xavier Worthy","pos":"WR","std":144,"ppr":134},{"name":"Tre Tucker","pos":"WR","std":145,"ppr":139},{"name":"Jaylin Noel","pos":"WR","std":146,"ppr":138},{"name":"Caleb Douglas","pos":"WR","std":147,"ppr":141},{"name":"Pat Bryant","pos":"WR","std":148,"ppr":142},{"name":"Tank Bigsby","pos":"RB","std":149,"ppr":null},{"name":"Dylan Sampson","pos":"RB","std":150,"ppr":131},{"name":"Jonah Coleman","pos":"RB","std":151,"ppr":null},{"name":"Mike Washington","pos":"RB","std":152,"ppr":null},{"name":"Josh Jacobs","pos":"RB","std":153,"ppr":null},{"name":"Tyrone Tracy","pos":"RB","std":154,"ppr":null},{"name":"Nick Singleton","pos":"RB","std":155,"ppr":null},{"name":"Emmett Johnson","pos":"RB","std":156,"ppr":null},{"name":"Zach Charbonnet","pos":"RB","std":157,"ppr":null},{"name":"Tyjae Spears","pos":"RB","std":158,"ppr":132},{"name":"Sean Tucker","pos":"RB","std":159,"ppr":null},{"name":"Jake Ferguson","pos":"TE","std":160,"ppr":151},{"name":"Dallas Goedert","pos":"TE","std":null,"ppr":152},{"name":"Hunter Henry","pos":"TE","std":null,"ppr":153},{"name":"Terrance Ferguson","pos":"TE","std":null,"ppr":154},{"name":"Dalton Kincaid","pos":"TE","std":null,"ppr":155},{"name":"Oronde Gadsden","pos":"TE","std":null,"ppr":156},{"name":"Kenyon Sadiq","pos":"TE","std":null,"ppr":157},{"name":"Malik Washington","pos":"WR","std":null,"ppr":158},{"name":"Adonai Mitchell","pos":"WR","std":null,"ppr":159},{"name":"Ja'Kobi Lane","pos":"WR","std":null,"ppr":160}];

const POS = ['QB','RB','WR','TE'];
const COLOR = {QB:'var(--qb)', RB:'var(--rb)', WR:'var(--wr)', TE:'var(--te)'};
const KEY = 'draftboard.v1';

let fmt = 'std';
let gone = new Map();      // name -> 'taken' | 'mine'
let order = [];            // pick order, most recent last

/* ---------- persistence (works when opened as a local file) ---------- */
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({fmt, order, gone:[...gone]}));
  }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(!s) return;
    fmt = s.fmt === 'ppr' ? 'ppr' : 'std';
    order = Array.isArray(s.order) ? s.order : [];
    gone = new Map(s.gone || []);
  }catch(e){}
}

/* ---------- data helpers ---------- */
const rankOf = p => fmt === 'ppr' ? p.ppr : p.std;
function available(){
  return PLAYERS
    .filter(p => !gone.has(p.name))
    .sort((a,b) => (rankOf(a) ?? 9999) - (rankOf(b) ?? 9999) || a.name.localeCompare(b.name));
}
const PR = new Map();
function buildPosRanks(){
  PR.clear();
  POS.forEach(pos => {
    PLAYERS.filter(q => q.pos === pos && rankOf(q) != null)
           .sort((a,b) => rankOf(a) - rankOf(b))
           .forEach((q,i) => PR.set(q.name, pos + (i+1)));
  });
}

/* ---------- marking ---------- */
function mark(name, how){
  if(gone.has(name)) return;
  gone.set(name, how);
  order.push(name);
  render(); save();
}
function unmark(name){
  gone.delete(name);
  order = order.filter(n => n !== name);
  render(); save();
}

/* ---------- rendering ---------- */
function rowEl(p, opts={}){
  const b = document.createElement('button');
  b.className = 'row' + (rankOf(p) == null ? ' absent' : '');
  b.title = 'Mark ' + p.name + ' as drafted';

  const rk = document.createElement('span');
  rk.className = 'rk';
  rk.textContent = opts.label ?? (rankOf(p) ?? '—');
  b.appendChild(rk);

  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = p.name;
  b.appendChild(nm);

  const po = document.createElement('span');
  po.className = 'po';
  po.style.color = COLOR[p.pos];
  po.textContent = opts.pos ?? p.pos;
  b.appendChild(po);

  b.addEventListener('click', e => {
    if(e.shiftKey) mark(p.name,'mine'); else mark(p.name,'taken');
  });

  const claim = document.createElement('span');
  claim.className = 'claim';
  claim.textContent = '+';
  claim.title = 'Add to my roster';
  claim.setAttribute('role','button');
  claim.tabIndex = 0;
  const take = e => { e.stopPropagation(); mark(p.name,'mine'); };
  claim.addEventListener('click', take);
  claim.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') take(e); });
  b.appendChild(claim);

  return b;
}

function render(){
  buildPosRanks();
  const avail = available();

  document.getElementById('fStd').setAttribute('aria-pressed', fmt==='std');
  document.getElementById('fPpr').setAttribute('aria-pressed', fmt==='ppr');

  // hero + next seven
  const hero = document.getElementById('hero');
  const rest = document.getElementById('rest');
  hero.innerHTML = ''; rest.innerHTML = '';

  if(avail.length === 0){
    hero.innerHTML = '<div class="empty">Every ranked player is off the board.</div>';
  } else {
    const p = avail[0];
    const h = document.createElement('div');
    h.className = 'hero';
    h.tabIndex = 0;
    h.innerHTML =
      '<div class="n"></div><div class="m">' +
      '<span class="pill"></span><span class="meta"></span></div>';
    h.querySelector('.n').textContent = p.name;
    const pill = h.querySelector('.pill');
    pill.textContent = PR.get(p.name) || p.pos;
    pill.style.background = COLOR[p.pos];
    h.querySelector('.meta').textContent =
      (rankOf(p) != null ? 'Overall ' + rankOf(p) : 'Unranked in this format') +
      ' · ' + (fmt === 'ppr' ? 'PPR' : 'Standard');
    const go = e => { if(e.shiftKey) mark(p.name,'mine'); else mark(p.name,'taken'); };
    h.addEventListener('click', go);
    h.addEventListener('keydown', e => { if(e.key==='Enter') go(e); });
    hero.appendChild(h);

    avail.slice(1,8).forEach(q => rest.appendChild(rowEl(q,{pos: PR.get(q.name) || q.pos})));
  }

  // position columns
  const cols = document.getElementById('cols');
  cols.innerHTML = '';
  POS.forEach(pos => {
    const list = avail.filter(p => p.pos === pos);
    const col = document.createElement('div');
    col.className = 'col';
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = '<span class="p"></span><span class="c"></span>';
    const ph = head.querySelector('.p');
    ph.textContent = pos;
    ph.style.color = COLOR[pos];
    head.querySelector('.c').textContent = list.length + ' left';
    col.appendChild(head);
    const body = document.createElement('div');
    body.className = 'body';
    if(list.length === 0){
      body.innerHTML = '<div class="empty">None left.</div>';
    } else {
      list.forEach(p => body.appendChild(rowEl(p,{pos: PR.get(p.name) || p.pos})));
    }
    col.appendChild(body);
    cols.appendChild(col);
  });

  // log (newest first) and roster
  const log = document.getElementById('log');
  log.innerHTML = '';
  if(order.length === 0){
    log.innerHTML = '<div class="empty">Nobody\'s off the board yet.</div>';
  } else {
    [...order].reverse().forEach((name, i) => {
      const p = PLAYERS.find(q => q.name === name);
      const b = document.createElement('button');
      b.className = 'row' + (gone.get(name)==='mine' ? ' is-mine' : '');
      b.title = 'Put ' + name + ' back on the board';
      b.innerHTML = '<span class="rk"></span><span class="nm"></span>' +
                    '<span class="po"></span><span class="x">undo</span>';
      b.querySelector('.rk').textContent = order.length - i;
      b.querySelector('.nm').textContent = name;
      const po = b.querySelector('.po');
      po.textContent = p.pos; po.style.color = COLOR[p.pos];
      b.addEventListener('click', () => unmark(name));
      log.appendChild(b);
    });
  }

  const mine = order.filter(n => gone.get(n)==='mine');
  const ros = document.getElementById('roster');
  ros.innerHTML = '';
  if(mine.length === 0){
    ros.innerHTML = '<div class="empty">Claim a player with the square on his row, or Shift+Enter from search.</div>';
  } else {
    POS.forEach(pos => {
      mine.filter(n => PLAYERS.find(q=>q.name===n).pos === pos).forEach(n => {
        const b = document.createElement('button');
        b.className = 'row';
        b.title = 'Remove ' + n + ' from my roster';
        b.innerHTML = '<span class="rk"></span><span class="nm"></span><span class="po"></span>';
        b.querySelector('.rk').textContent = order.indexOf(n) + 1;
        b.querySelector('.nm').textContent = n;
        const po = b.querySelector('.po');
        po.textContent = pos; po.style.color = COLOR[pos];
        b.addEventListener('click', () => unmark(n));
        ros.appendChild(b);
      });
    });
  }

  document.getElementById('cGone').textContent = order.length;
  document.getElementById('cMine').textContent = mine.length;
  document.getElementById('logCount').textContent = order.length ? 'click to undo' : '';
  document.getElementById('rosCount').textContent = mine.length ? mine.length + ' players' : '';

  const missing = PLAYERS.filter(p => rankOf(p) == null).length;
  document.getElementById('note').textContent =
    PLAYERS.length + ' players across both lists. ' + missing +
    ' are not in the ' + (fmt==='ppr' ? 'PPR' : 'standard') +
    ' list and sort to the bottom, shown in italics. Click a name to mark him drafted by anyone; ' +
    'the + square claims him for your roster. Your board is saved in this browser.';
}

/* ---------- search ---------- */
const search = document.getElementById('search');
const results = document.getElementById('results');
let matches = [], sel = 0;

function norm(s){ return s.toLowerCase().replace(/[^a-z]/g,''); }

function runSearch(){
  const q = norm(search.value);
  if(!q){ results.classList.remove('on'); matches = []; return; }
  const pool = available();
  const starts = pool.filter(p => norm(p.name).startsWith(q));
  const last  = pool.filter(p => !starts.includes(p) &&
                  p.name.split(' ').slice(1).some(w => norm(w).startsWith(q)));
  const any   = pool.filter(p => !starts.includes(p) && !last.includes(p) && norm(p.name).includes(q));
  matches = [...starts, ...last, ...any].slice(0,7);
  sel = 0;
  drawResults();
}

function drawResults(){
  results.innerHTML = '';
  if(matches.length === 0){
    results.innerHTML = '<div class="hint">No available player matches that.</div>';
    results.classList.add('on');
    return;
  }
  matches.forEach((p,i) => {
    const b = document.createElement('button');
    b.className = 'r' + (i===sel ? ' sel' : '');
    b.innerHTML = '<span class="rk"></span><span class="nm"></span><span class="po"></span>';
    b.querySelector('.rk').textContent = rankOf(p) ?? '—';
    b.querySelector('.nm').textContent = p.name;
    const po = b.querySelector('.po');
    po.textContent = PR.get(p.name) || p.pos;
    po.style.color = COLOR[p.pos];
    po.style.fontSize = '11px';
    po.style.fontWeight = '700';
    b.addEventListener('click', e => { take(p, e.shiftKey); });
    results.appendChild(b);
  });
  const h = document.createElement('div');
  h.className = 'hint';
  h.textContent = 'Enter marks him drafted · Shift+Enter adds him to your roster';
  results.appendChild(h);
  results.classList.add('on');
}

function take(p, mineFlag){
  mark(p.name, mineFlag ? 'mine' : 'taken');
  search.value = '';
  results.classList.remove('on');
  matches = [];
  search.focus();
}

search.addEventListener('input', runSearch);
search.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, matches.length-1); drawResults(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); drawResults(); }
  else if(e.key === 'Enter' && matches[sel]){ e.preventDefault(); take(matches[sel], e.shiftKey); }
  else if(e.key === 'Escape'){ search.value=''; results.classList.remove('on'); matches=[]; }
});
document.addEventListener('click', e => {
  if(!e.target.closest('.searchwrap')) results.classList.remove('on');
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== search){ e.preventDefault(); search.focus(); }
});

/* ---------- controls ---------- */
document.getElementById('fStd').addEventListener('click', () => { fmt='std'; render(); save(); runSearch(); });
document.getElementById('fPpr').addEventListener('click', () => { fmt='ppr'; render(); save(); runSearch(); });
document.getElementById('reset').addEventListener('click', () => {
  if(order.length && !confirm('Put all ' + order.length + ' players back on the board?')) return;
  gone = new Map(); order = []; render(); save();
});

load();
render();
search.focus();
</script>
</body>
